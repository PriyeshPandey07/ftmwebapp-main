name: Admin Fleetstakes - Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 4. Build frontend
      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      # 5. Copy build files to server
      - name: Copy build files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "build/*"
          target: "/home/ubuntu/fsadmin_deploy"

      # 6. Deploy and reload Nginx
      - name: Deploy and reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e

            echo "Removing old frontend files..."
            sudo rm -rf /var/www/html/fsadmin/app/html/*

            echo "Copying new frontend files..."
            sudo cp -r /home/ubuntu/fsadmin_deploy/build/* /var/www/html/fsadmin/app/html/

            echo "Setting permissions..."
            sudo chown -R www-data:www-data /var/www/html/fsadmin/app/html/

            echo "Testing Nginx configuration..."
            sudo nginx -t

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Deployment completed successfully!"
