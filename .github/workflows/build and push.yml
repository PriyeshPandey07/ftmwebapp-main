name: Admin Fleetstakes - Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        working-directory: ./
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: ./
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Check build output
        run: |
          echo "===== Build output ====="
          ls -lah ./build

      - name: Copy build files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "ftmwebapp-main/build/*"
          target: "/home/ubuntu/fsadmin_deploy"

      - name: Deploy and reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e

            echo "===== Deploying Admin Fleetstakes ====="

            sudo rm -rf /var/www/html/fsadmin/app/html/*

            sudo cp -r \
              /home/ubuntu/fsadmin_deploy/ftmwebapp-main/build/* \
              /var/www/html/fsadmin/app/html/

            sudo chown -R www-data:www-data \
              /var/www/html/fsadmin/app/html/

            sudo nginx -t

            sudo systemctl reload nginx

            echo "===== Deployment successful ====="
